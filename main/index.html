<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/main//public/style.css" />
  <title>Réservation vetements</title>
</head>

<body>
  <div id="app">
  <h1>Commandes</h1>
    <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Item</th>
        <th>Quantité</th>
        <th>Prix</th>
        <th>Heure</th>
      </tr>
    </thead>
    <tbody id="liste"><tr><td colspan="5">Chargement...</td></tr></tbody>
  </table>

  <h2>Nouvelle commande</h2>
  <form id="form">
    <label for="id">Numero de commande</label>
    <input name="id" placeholder="123456" required>
    <label for=item">Item</label>
    <input name="item"  required>
    <label for="quantite">Quantité</label>
    <input name="quantite" type="number" required>
    <label for="prix">Prix</label>
    <input name="prix" type="" required>
    <label for="heure">Heure</label>
    <input name="heure" type="time" required>

    <button type="submit">Commander</button>
  </form>
  <p id="message"></p>

  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
